<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Calculator</title>
  <link rel="stylesheet" href="ite_calc.css">
</head>
<body>
  <h1 class="calc-title">Dead Calculator Service</h1>

  <div class="calc-wrapper">
    <table class="calc-outer">
      <tr>
        <td>
          <table class="calc-inner">
            <tr class="calc-screen-row">
              <td colspan="5" class="calc-screen"></td>
            </tr>
            <tr>
              <td>Mc</td>
              <td>M-</td>
              <td>M+</td>
              <td>&#8730;</td>
              <td>&#37;</td>
            </tr>
            <tr>
              <td>&#8594;</td>
              <td>7</td>
              <td>8</td>
              <td>9</td>
              <td>&#247;</td>
            </tr>
            <tr>
              <td>CE</td>
              <td>4</td>
              <td>5</td>
              <td>6</td>
              <td><b>X</b></td>
            </tr>
            <tr>
              <td>AC</td>
              <td>1</td>
              <td>2</td>
              <td>3</td>
              <td>-</td>
            </tr>
            <tr>
              <td>0</td>
              <td>00</td>
              <td>.</td>
              <td>=</td>
              <td>+</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
