<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ITE Project Sign In</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">

      <div class="left">
        <div class="logo">⚡</div>

        <h1>Welcome to the ITE Project</h1>
        <p class="subtitle">hope you will like it ;)</p>

        <p class="welcome-line">
          <i><b>Welcome Dear Visitor, Please Sign In to Use the ITE HTML Project</b></i>
        </p>

        
        <form action="ite-main.html" method="get">
         
          <table class="login-table" >
            <tr>
              <td><label><b>Username</b></label></td>
              <td><input type="text" name="username"></td>
            </tr>
            <tr>
              <td><label><b>Password</b></label></td>
              <td><input type="password" name="password"></td>
            </tr>
            <tr>
              <td></td>
              <td>
                <div class="buttons-row">
                  <input type="reset" value="Reset" class="btn re">
                  <input type="submit" value="Sign In" class="btn si">
                </div>
              </td>
            </tr>
          </table>
        </form>
      </div>

      <div class="right">
        <img src="images/photo.jpg" >
      </div>

    </div>
  
</body>
</html>
